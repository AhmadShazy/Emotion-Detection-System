# Google Cloud Build — builds the image inside GCP and pushes it to Artifact
# Registry, ready for Cloud Run.
#
# Why build here rather than locally
# ----------------------------------
# The image is ~5 GB (roughly 1.7 GB of models plus torch and the rest of the
# stack). Measured on the development machine, package downloads ran at
# 9-76 kB/s: about 8 hours to build and closer to 18 to push, and a push cannot
# resume from a layer cache the way a build can. Cloud Build pulls at datacenter
# speed and pushes to a registry in the same network, so only the repository
# leaves the laptop.
#
# One-time setup
# --------------
#   gcloud services enable cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com
#   gcloud artifacts repositories create humanoid --repository-format=docker --location=us-central1
#
# Run it
# ------
#   gcloud builds submit --config cloudbuild.yaml
#
# Override the region or repository without editing this file:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_REPO=humanoid

substitutions:
  _REGION: us-central1
  _REPO: humanoid
  _IMAGE: humanoid-input

options:
  # The default machine has too little disk and CPU for a 5 GB image with a
  # 1.7 GB model download. This costs more per minute and far less in total,
  # because the build is not sitting waiting on itself.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# The default is 10 minutes, which this build cannot possibly meet — installing
# torch and downloading five models takes longer than that even on a fast link.
# Leaving it at the default is the most common way a first Cloud Build attempt
# fails, and the error looks like a timeout rather than anything diagnostic.
timeout: 3600s

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${SHORT_SHA}"

steps:
  # Pull the previous image, if any, so its layers can be reused. Without this
  # every build repeats the ~1.7 GB model download from scratch. The || true
  # matters: the very first build has nothing to pull and must not fail here.
  - id: warm-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest" || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${SHORT_SHA}
      - .

  # Proves the image is self-contained. Baking the models in is pointless if
  # something still reaches for the network at boot — on a host with restricted
  # egress that produces a server which starts, passes its health check, and
  # answers "neutral" forever. Better to fail here than to discover it live.
  # The checks live in scripts/verify_image.sh, shared with the GitHub Actions
  # workflow, so the two pipelines cannot drift apart about what "verified"
  # means. Keeping the inline shell here to a single line also sidesteps Cloud
  # Build's substitution rules, which require every shell $ to be written $$
  # and turn a missed one into a confusing build-time substitution error.
  - id: verify-offline
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - scripts/verify_image.sh
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest

# ─────────────────────────────────────────────────────────────────────────────
# Deploying what this produces
#
#   gcloud run deploy humanoid-input \
#     --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest \
#     --region=${_REGION} \
#     --memory=4Gi \
#     --cpu=2 \
#     --timeout=3600 \
#     --max-instances=1 \
#     --concurrency=4 \
#     --set-secrets=API_KEYS=humanoid-api-keys:latest \
#     --allow-unauthenticated
#
# Each of those flags is load-bearing, not a default worth trimming:
#
#   --memory=4Gi      measured resident set is 1.54 GB with every model loaded.
#                     2 GB does not fit. 4 GB works because the models are baked
#                     into the image rather than downloaded into memory at boot.
#   --timeout=3600    Cloud Run applies its request timeout to WEBSOCKETS too,
#                     and the default 300 s severs a live call mid-conversation
#                     at five minutes.
#   --max-instances=1 session state and the live-call capacity counter are both
#                     per-process. A second instance treats a known session_id
#                     as brand new, and Cloud Run scales on CPU — which this app
#                     pins during exactly the requests that matter, so a second
#                     instance appears precisely when someone is using it.
#   --concurrency=4   the admission control this app does not implement itself.
#   --set-secrets     never pass API_KEYS as a plain env var. Leaving it unset
#                     starts the server with authentication disabled.
#
# The frontend is served by the app, so --allow-unauthenticated is right: the
# API key gates /analyze/* and /ws/stream, and Cloud Run's own IAM would block
# the browser before it could present one.
# ─────────────────────────────────────────────────────────────────────────────
