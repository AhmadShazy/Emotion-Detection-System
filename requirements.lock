# requirements.lock - the exact environment that passes the test suite.
#
# Generated with 'pip freeze' from the .venv on Python 3.10.11, which is the
# environment 84 tests pass in. INSTALL THIS IN THE IMAGE, not requirements.txt.
#
# Why a lock exists at all
# ------------------------
# requirements.txt pins almost nothing, so two installs a week apart resolve to
# different libraries. That is not theoretical here: the two interpreters on the
# development machine had already drifted across three major-version boundaries
# (transformers 4.57 vs 5.8, speechbrain 1.0.3 vs 1.1.0, torch 2.9 vs 2.11,
# starlette 0.27 vs 1.0), so "the tests pass" was only ever true of one of them.
#
# It matters more than usual because of how this system fails.
# src/ser/ser_engine.py monkeypatches a PRIVATE SpeechBrain API, and one of its
# patches exists precisely because transformers removed AutoModelWithLMHead in
# v5. model_registry.load_all() swallows every loader exception, and /health
# reports "ok" regardless. A resolver picking different versions inside
# 'docker build' therefore does not crash - it produces a server that starts
# cleanly, passes its health check, and returns "neutral" for every voice,
# video and live turn. Silent wrongness is the failure mode this file prevents.
#
# torch and torchaudio
# --------------------
# Install these from https://download.pytorch.org/whl/cpu FIRST. The PyPI Linux
# wheels carry CUDA and add several GB to an image with no GPU to use it. The
# Dockerfile does this as a separate step; under PEP 440 a local version like
# 2.11.0+cpu satisfies ==2.11.0, so the pass over this file leaves them alone.
#
# A caveat: this was frozen on WINDOWS
# ------------------------------------
# So it is a complete record of the environment the tests pass in, but not a
# complete record of what a Linux image ends up with. Two packages have no
# Windows wheels and therefore cannot appear here, yet install in the container
# as hard dependencies of things that are pinned:
#
#   triton       required by openai-whisper. ~200 MB of GPU compiler that a CPU
#                deployment never executes, and not removable without dropping
#                openai-whisper's own dependency metadata.
#   sounddevice  required by mediapipe. Excluded below and reinstalled anyway,
#                which is why the Dockerfile installs libportaudio2.
#
# pip resolves those two freely, so they are the part of the image this file
# does not actually pin. To close the gap properly, run pip freeze INSIDE the
# built image and commit that as the authoritative lock.
#
# Regenerating
# ------------
#   pip freeze > requirements.lock    then re-apply the exclusions below
#
# Do that deliberately, after upgrading and re-running the tests - never as a
# routine tidy-up.
#
# Excluded from the freeze on purpose (note: pip may reinstall them anyway as
# transitive dependencies - see the caveat above):
#   pyreadline3    Windows-only readline shim
#   sounddevice    needs the PortAudio system library, and no request path uses it - the server owns no capture device
#
